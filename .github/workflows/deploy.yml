name: Deploy

# Deploys what is on main, so the live site always matches a commit rather
# than whatever happened to be on someone's laptop.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # Never ship a red build. These are the same checks CI runs on a PR.
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

      - name: Apply D1 migrations
        run: bunx wrangler d1 migrations apply agentreadme --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # Bake the commit into the build so production can say where it came from.
      - name: Deploy
        run: bunx wrangler deploy --var GIT_SHA:"${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Smoke test
        run: |
          set -e
          BASE="${{ vars.DEPLOY_URL || 'https://agentreadme.dejan-dvte.workers.dev' }}"
          for path in / /leaderboard /about /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 3 "$BASE$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || { echo "FAILED on $path"; exit 1; }
          done
          # Confirm the deploy that just ran is the one serving traffic.
          # A new version takes a little while to reach every location, and curl
          # --retry does not help: a stale version answers 200, so there is
          # nothing for it to retry on. Poll until it matches or time out.
          want="${{ github.sha }}"
          for i in $(seq 1 24); do
            live=$(curl -s "$BASE/version?cb=$i" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4)
            if [ "$live" = "$want" ]; then
              echo "live commit matches after ${i} checks: $live"
              exit 0
            fi
            echo "  attempt $i: serving $live, waiting for $want"
            sleep 5
          done
          echo "Timed out after two minutes still serving $live, expected $want"
          exit 1
